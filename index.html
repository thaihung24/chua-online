    <!-- CSS tối thiểu để màn hình mở đầu hiện đẹp ngay trước khi nạp gói chính -->
    <style>
      html, body { margin: 0; background: #140d08; color: #f5ead9; }
      .world-root { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #140d08; }
      .boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(90% 70% at 50% 28%, #3a2515 0%, #1b120b 58%, #140d08 100%); }
    </style>
  </head>
  <body>
    <div id="world" class="world-root"></div>
    <div id="app"></div>

    <!-- Màn hình mở đầu (boot splash): U1 điều khiển tiến trình qua #bootFill/#bootStatus -->
    <div class="boot" id="boot" role="status" aria-live="polite">
      <div class="boot__glow" aria-hidden="true"></div>
      <div class="boot__inner">
        <svg class="boot__lotus" viewBox="0 0 160 130" width="150" height="122" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="bootGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbe3a2" />
              <stop offset=".55" stop-color="#e0b25c" />
              <stop offset="1" stop-color="#b9822f" />
            </linearGradient>
            <radialGradient id="bootHalo" cx="50%" cy="55%" r="55%">
              <stop offset="0" stop-color="#f3c973" stop-opacity=".38" />
              <stop offset="1" stop-color="#f3c973" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle cx="80" cy="66" r="62" fill="url(#bootHalo)" />
          <g class="boot__petals" fill="none" stroke="url(#bootGold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path class="bp bp-c" d="M80 14c17 18 21 42 0 74-21-32-17-56 0-74z" fill="rgba(243,201,115,.14)" />
            <path class="bp bp-l1" d="M62 38C42 42 30 56 28 76c2 18 20 28 52 28" fill="rgba(243,201,115,.08)" />
            <path class="bp bp-r1" d="M98 38c20 4 32 18 34 38-2 18-20 28-52 28" fill="rgba(243,201,115,.08)" />
            <path class="bp bp-l2" d="M54 68C34 68 18 76 12 92c6 10 24 14 46 12" />
            <path class="bp bp-r2" d="M106 68c20 0 36 8 42 24-6 10-24 14-46 12" />
            <path class="bp bp-b" d="M34 112c28 10 64 10 92 0" stroke-width="2" />
            <path class="bp bp-b2" d="M50 121c20 5 40 5 60 0" stroke-width="1.6" opacity=".6" />
          </g>
        </svg>
        <h1 class="boot__title">Chùa Rắn</h1>
        <p class="boot__tag">Lên chùa mọi lúc, mọi nơi</p>
        <div class="boot__bar" aria-hidden="true"><span id="bootFill"></span></div>
        <p class="boot__status" id="bootStatus">Đang mở cổng chùa…</p>
      </div>
      <nav class="boot__links" aria-label="Trang giới thiệu">
        <a href="/gioi-thieu/">Giới thiệu</a>
        <a href="/huong-dan-di-chua-online/">Hướng dẫn đi chùa online</a>
        <a href="/kinh/">Tụng kinh</a>
        <a href="/lich-am/">Lịch âm</a>
        <a href="/hoi-dap/">Hỏi đáp</a>
      </nav>
      <noscript>
        <p class="boot__noscript">Chùa Rắn cần JavaScript để dựng cảnh chùa 3D. Bạn vui lòng bật JavaScript, hoặc đọc <a href="/kinh/">kinh văn</a> và xem <a href="/lich-am/">lịch âm</a> ngay trên các trang tĩnh.</p>
      </noscript>
    </div>

    <div id="onboarding-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
