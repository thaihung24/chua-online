<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="crBg" cx="50%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#3a2313"/>
      <stop offset="62%" stop-color="#1b1109"/>
      <stop offset="100%" stop-color="#110a05"/>
    </radialGradient>
    <radialGradient id="crHalo" cx="50%" cy="52%" r="50%">
